[package]
name = "target-match"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
description = "Pure-Rust, dependency-light target identification for astrophotography: given a telescope pointing and field of view, rank which catalogued sky objects fall on the frame — by sky position, never by name."
repository = "https://github.com/nightwatch-astro/target-match"
readme = "README.md"
keywords = ["astronomy", "astrophotography", "catalog", "coordinates", "fov"]
categories = ["science", "mathematics"]

[features]
# Off by default. Derives Serialize/Deserialize on the public coordinate and
# match types so positions/results can be (de)serialized to JSON and other
# formats. Zero cost for consumers who don't opt in.
serde = ["dep:serde"]

[dependencies]
# No runtime dependencies: the crate is pure trigonometry over `std`. `serde` is
# optional and off by default.
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
# Property-based testing of the geometric invariants (separation symmetry,
# radius-boundary inclusivity, sexagesimal round-trip).
proptest = "1"

[lib]
path = "src/lib.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
