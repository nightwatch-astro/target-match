[package]
name = "target-match"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
description = "Given a telescope pointing and field of view, rank which catalogued sky objects fall on the frame. Matches by sky position; holds no catalogue data and does no I/O."
repository = "https://github.com/nightwatch-astro/target-match"
documentation = "https://docs.rs/target-match"
readme = "README.md"
keywords = ["astronomy", "astrophotography", "catalog", "coordinates", "fov"]
categories = ["science", "mathematics"]

# docs.rs builds with default features only unless told otherwise; include the
# optional `serde` derives in the generated API documentation.
[package.metadata.docs.rs]
all-features = true

[features]
# Off by default. Derives Serialize/Deserialize on the public match types (and,
# via skymath, the coordinate types they embed) so positions/results can be
# (de)serialized to JSON and other formats. Zero cost for consumers who don't opt in.
serde = ["dep:serde", "skymath/serde"]

[dependencies]
# Shared astronomy math: Angle/Equatorial/Epoch, sexagesimal parsing, spherical
# geometry, precession. target-match's public API uses these types directly.
skymath = "0.1"
# Typed public error enum. Pure-Rust, proc-macro only — no runtime weight.
thiserror = "2"
# Optional, off by default: derives Serialize/Deserialize on public data types.
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
# Property-based testing of the matcher invariants (matcher==rank equivalence).
proptest = "1"
# Application-style error handling in the example only (never the public API).
anyhow = "1"
# Exercises the optional `serde` feature end-to-end (feature-gated test).
serde_json = "1"

[lib]
path = "src/lib.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
